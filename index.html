<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ikke trykk her</title>
<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    width: 100%;
    height: 100%;
    margin: 0;
    background: #000;
  }

  body {
    min-height: 100vh;
    overflow: hidden;
  }

  .screen-backdrop {
    position: fixed;
    inset: -28px;
    background: url("assets/ikke-trykk-her.png") center / cover no-repeat;
    filter: blur(18px) brightness(0.42);
  }

  .stage {
    position: fixed;
    inset: 0;
    z-index: 1;
    display: grid;
    place-items: center;
    width: 100vw;
    height: 100vh;
    padding: clamp(10px, 2.5vmin, 28px);
  }

  .screen-image {
    display: block;
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }

  @supports (height: 100dvh) {
    body {
      min-height: 100dvh;
    }

    .stage {
      height: 100dvh;
    }
  }
</style>
</head>
<body>
  <div class="screen-backdrop" aria-hidden="true"></div>
  <main class="stage">
    <img
      class="screen-image"
      src="assets/ikke-trykk-her.png"
      alt="Nå har du trykka på en link du ikke skulle ha trykka på"
    />
  </main>
</body>
</html>
