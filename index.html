<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ikke trykk her</title>
<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    width: 100%;
    min-height: 100%;
    margin: 0;
    background: #000;
  }

  body {
    overflow: hidden;
  }

  .screen-cover {
    position: fixed;
    inset: 0;
    display: block;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    object-position: center center;
  }

  @supports (height: 100dvh) {
    .screen-cover {
      height: 100dvh;
    }
  }
</style>
</head>
<body>
  <img
    class="screen-cover"
    src="assets/ikke-trykk-her.png"
    alt="Nå har du trykka på en link du ikke skulle ha trykka på"
  />
</body>
</html>
